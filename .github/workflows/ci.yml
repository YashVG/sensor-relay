name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Rust and process recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
      - name: Install pinned toolchain
        run: rustup show
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5, Node 24
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .runtime
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'scripts/cargo.sh') }}
      - name: Formatting
        run: ./scripts/cargo.sh fmt --check
      - name: Lints
        run: ./scripts/cargo.sh clippy --locked --all-targets -- -D warnings
      - name: Contracts and HTTP behavior
        run: ./scripts/cargo.sh test --locked
      - name: Build process scenario binaries
        run: ./scripts/cargo.sh build --locked --bins
      - name: Lost ACK, SIGKILL, and edge recovery
        run: python3 scripts/scenario.py --profile debug
